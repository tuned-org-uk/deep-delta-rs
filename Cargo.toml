[package]
name = "deep-delta-learn"
version = "0.1.0"
edition = "2024"
description = "An implementation of Deeep Delta Learning as in 2601.00417"
authors = ["Lorenzo <tunedconsulting@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/tuned-org-uk/deep-delta-learn"
homepage = "https://github.com/tuned-org-uk/deep-delta-learn"
documentation = "https://docs.rs/deep-delta-learn"
readme = "README.md"
keywords = ["resnet", "gpt", "llm"]
categories = ["algorithms", "mathematics", "science"]
exclude = [
    "target/*",
    "Cargo.lock",
    ".git/*",
    ".github/*",
    "*.tmp",
    "*.md",
    "*.bib",
    "*.cff",
    "test_data/*",
    "examples/*"
]
[dependencies]
# Burn with default CPU + optional GPU backends
burn = { version = "0.18.0", default-features = false, features = ["std", "train"] }
burn-ndarray = { version = "0.18.0", optional = true }
burn-wgpu = { version = "0.18.0", optional = true }
burn-cuda = { version = "0.18.0", optional = true }

# Core dependencies
ndarray = { version = "0.16.1", optional = true }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
env_logger = "0.11.8"
log = "0.4.28"

[dev-dependencies]
approx = "0.5.1"

[features]
default = ["cpu"]
cpu = ["burn-ndarray", "ndarray"]
wgpu = ["burn-wgpu"]
cuda = ["burn-cuda"]

# Convenience feature for all backends
all-backends = ["cpu", "wgpu", "cuda"]

[lib]
name = "deep_delta_learn"
crate-type = ["rlib"]

[[bin]]
name = "deep-delta"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # Faster dev builds
